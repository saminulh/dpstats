# Prose lint (prose.mjs): STYLE S10 applies Google's developer documentation
# style to the API reference and guides. Only errors fail, against
# prose-baseline.json; warnings and suggestions are reported. Rules another
# check owns (retired terms, historical references) are not repeated here.
StylesPath = vale-styles
MinAlertLevel = suggestion
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/readability/releases/download/v0.2.0/Readability.zip

[*.{md,ipynb,html}]
BasedOnStyles = Google, Readability
# An array's dimensions ("1D", "2D") are not a count of days.
TokenIgnores = (\b[1-3][dD]\b)
# Tutorials speak in a walkthrough voice ("we walk through", STYLE S33).
Google.We = NO
# One readability score, as a suggestion: scores are crude for statistical prose.
Readability.FleschKincaid = suggestion
Readability.Polysyllables = NO
Readability.ColemanLiau = NO
Readability.FleschReadingEase = NO
Readability.LIX = NO
Readability.GunningFog = NO
Readability.AutomatedReadability = NO
Readability.SMOG = NO
