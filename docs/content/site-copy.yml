# Explanatory text the generated site pages show. Each entry is one slot.
# PLACEHOLDER shows a dashed marker naming the slot (⟨group.key⟩), so you can find it on the page.
# Blank ("") or omitted shows nothing there. Any other text shows as written: it is escaped,
# not interpreted as HTML, and YAML block text (|) keeps its line breaks.
# [text](url) is a link. Link to site pages by their public address
# (https://saminulh.github.io/dpstats/...); every build points it at itself.
# Tooltips show only the link text.

home:
  # Home, a task's panel when the release declares the task but publishes no standings.
  task_no_standings: "This task is missing its standings"
  # Home, in place of every task's standings when the build reads no benchmark release.
  no_release: "No standings available in this build"
  # Home, screen-reader name of the row of task tabs.
  tabs_label: "Benchmarked tasks"
  # Home, a task's panel, the link to the task's overview beside its Leaderboard and Explore links.
  task_link: "Task"
  # Home, a task's panel, the fold holding the methodology link.
  source_summary: "Source and interpretation"
  # Home, a task's panel, the link to its full Leaderboard above the plotted list.
  board_link: "Leaderboard"
  # Home, hover text on that Leaderboard link.
  board_link_title: "Open the Leaderboard"
  # Home, a task's panel, the link to its Explore page above the plotted list.
  explore_link: "Explore"

leaderboard:
  # Leaderboard, the first paragraph above the standings. [roster] links to the task's Roster, [Methodology] to the Methodology page, [Submit] to the Submit page.
  intro: "Official rankings and performance curves for every algorithm in the [roster]. For more details on the metrics and our broader methodology, visit the [Methodology] page. To submit your own algorithm to the roster, visit the [Submit] page."
  # Leaderboard, the second paragraph above the standings. [public corpus] links to the task's Corpus page, [Explore] to the task's Explore page (plain text where the task has none).
  intro_corpus: "We compute these rankings on a withheld corpus, so to limit leakage about this corpus, we only report each algorithm’s aggregate performance curve below. To conduct more fine-grained analyses on the [public corpus], visit the [Explore] page."
  # Leaderboard and Home rankings table, the row shown when a panel ranks no algorithm.
  empty_panel: "No algorithms in the roster."
  # Leaderboard and Home, above a chart whose results could not load. Fields: {error}, the browser's reason the load failed.
  results_load_error: "Could not load results: {error}"
  # Leaderboard, the Eligibility line of the absences note, when ranked algorithms carry no privacy interpretation. Fields: {names}, the algorithms' labels, comma-separated.
  missing_interpretation: "No privacy interpretation: {names}"
  # Leaderboard and Home rankings table, the Rank column heading; also the Rank column heading of the standings list beside the chart (Leaderboard, Home, Explore) and hover text on each rank there.
  column_rank: "Rank"
  # Leaderboard, Explore and Roster rankings, the heading of the headline column: each algorithm's error ratio at the protocol's quantile, which it ranks by. Fields: {percent}, that quantile in percent (50 for the median).
  column_headline: "τ@{percent}"
  # Leaderboard, Explore, Home, the standings beside the chart, the Roster pages and the algorithm dialog: the headline cell of an algorithm that never reaches the protocol's quantile. Fields: {percent}, the share of weighted trials it does reach, in whole percent.
  unreached: "∞ (reaches {percent}%)"
  # Leaderboard, the label of the slice selector: which official slice of the task's problem instances the standings rank.
  slice_label: "Regime"
  # Leaderboard, the slice holding every problem instance of the task.
  slice_all: "All"
  # Leaderboard, a slice of the problem instances whose property is at most a bound. Fields: {feature}, the property's symbol (d or n/d); {value}, the bound.
  slice_at_most: "{feature} ≤ {value}"
  # Leaderboard, a slice of the problem instances whose property is above a bound. Fields: {feature}, the property's symbol (d or n/d); {value}, the bound.
  slice_above: "{feature} > {value}"
  # Leaderboard, after the slice selector's options: the selected slice's size, which follows the selection. Fields: {instances}, its problem instances; {studies}, the studies they come from.
  slice_size: "{instances} problem instances from {studies} studies"
  # Leaderboard, the same when the slice's several problem instances come from one study. Fields: {instances}, its problem instances; {studies}, which is 1.
  slice_size_one: "{instances} problem instances from {studies} study"
  # Leaderboard, the same when the slice holds one problem instance, which comes from one study. Fields: {instances}, which is 1; {studies}, which is 1.
  slice_size_one_instance: "{instances} problem instance from {studies} study"

explore:
  # Explore and Leaderboard, the Trial aggregation box's label, beside the Individual / Median per instance choice (the Leaderboard's fixed value).
  trials_label: "Trial aggregation"
  # Explore, control bar, the button that opens the instance filter.
  filter_instances: "Filter instances"
  # Explore, control bar, inside the Filter instances button: how many instances the filter keeps. Fields: {selected}, the instances kept; {total}, all instances.
  instance_count: "{selected} of {total}"
  # Explore, control bar, the button that downloads the open view as a notebook.
  download_notebook: "Download notebook"
  # Explore, the paragraph above the controls. Bare links: [public corpus], the task's Corpus page; [Leaderboard], the task's Leaderboard.
  introduction: "Explore the results on the [public corpus]. For official rankings, visit the [Leaderboard] page. This page allows more fine-grained analyses than the Leaderboard, and you can download the plots as notebooks to carry out further analyses."
  # Explore, Error ratio by instance property, above the chart.
  feature_intro: "This graph plots the algorithm's error on an instance, normalized by the baseline, against the selected instance property. Rings at the top may appear signifying trials with infinite error, the size of the ring grows with the number of trials there. The graph additionally plots a sliding-window median and interquartile range to give a sense of how the error depends on this property."
  # Explore, Trial outcomes by instance property, above the chart.
  outcomes_intro: "This histogram shows how the success rate of an algorithm breaks down over the problem instances by the selected instance property. Each bin corresponds to a subset of the instances and the bars correspond to individual outcomes within that bin (i.e., output error within threshold, output error above threshold, or some algorithm error occurred). Click on a bar to get more details. If you select a comparison algorithm, the histogram instead shows the proportion of instances where both algorithms succeed, only one succeeds, or both fail."
  # Explore, Trial outcomes by instance property, the "How to read this chart" help.
  outcomes_glossary: "Each bar is one bin of problem instances. Its segments show the weighted share of trials within the threshold, above it, or ended by an algorithm error."
  # Outcomes, Explain this bar, above the numerical breakdown.
  outcomes_bar_help: "Click a bar or pick a range to see its outcomes and instances."
  # Explore, help on the Instance property control.
  feature_help: "The property of the problem instance used to group the histogram bins."
  # Explore, help on the Scale control.
  feature_scale_help: "How the property is spaced for binning: logarithmic, linear, or quantile."
  # Explore, Trial outcomes by instance property, when no algorithm is selected.
  outcomes_empty: "Please choose an algorithm."
  # Explore, Error ratio by instance property, "This point" panel beside the chart, before a marker is selected.
  point_details_prompt: "Click a point to see details about the problem instance."
  # Explore, chart area when the instance filters leave no instance.
  empty_no_instances: "No problem instances match the chosen filters. Please choose different filter settings."
  # Explore, chart area when no selected algorithm has a trial left.
  empty_no_algorithms: "No algorithms match the chosen filters. Please choose different filter settings."
  # Explore, Error ratio by instance property chart area when no selected algorithm has a value on the feature.
  empty_no_feature_values: "No selected algorithm has a value on this instance property."
  # Explore, Baseline control status when the chosen baseline algorithm has no trials at this budget.
  baseline_no_trials: "No trials at this budget."
  # Explore, Instance property menu, hover text on ε when the budget has no finite ε for every instance.
  feature_unavailable_epsilon: "ε is unavailable: this budget does not give a finite ε for every problem instance."
  # Explore, Instance property menu, hover text on the condition number when an instance has no finite one.
  feature_unavailable_condition_number: "The condition number is unavailable: not every problem instance has a finite one."
  # Explore, Instance property menu, hover text on a feature every instance in the panel shares.
  feature_unavailable_constant: "Unavailable: every problem instance in this panel has the same value."
  # Explore, comparison algorithm picker status when five algorithms are already chosen.
  picker_full: "Compare up to five at a time; remove one from Plotted to add another."
  # Explore, comparison algorithm picker, the greyed text in its box when five are chosen.
  picker_full_placeholder: "Remove one to add another"
  # Explore, Trial outcomes by instance property note, after the excluded share of instances.
  histogram_excluded_reason: "No value for this property, or one of the algorithms never ran on the instance."
  # Explore, Trial outcomes by instance property note, when bin edges snap to ties.
  histogram_snapped_note: "Bin edges moved to avoid splitting tied values, so bins are not exactly equal-weight."
  # Explore, Trial outcomes by instance property note, when "Compare with" pairs two algorithms.
  histogram_paired_note: "With a second algorithm, it plots the probability of both being within the threshold, only one within the threshold, and neither. If one of the algorithms never ran on an instance, that instance is omitted."
  # Explore, Error ratio by instance property, last line of a marker's hover text.
  scatter_click_hint: "Click for details."
  # Explore, Filter instances, hover text on the n, d and n/d range boxes.
  range_hint_whole: "Type a whole number or use the slider; snaps to available integer limits."
  # Explore, Filter instances, hover text on the condition-number range boxes.
  range_hint_positive: "Type a positive number or use the slider; snaps to available limits."
  # Explore, the status line while the page loads its index.
  loading: "Loading Explore…"
  # Explore, the status line when the page's index could not load, beside the Retry button.
  load_error: "Explore could not load. Please retry."
  # Explore, the status line while the selected metric and budget's results load.
  results_loading: "Loading selected results…"
  # Explore, the status line when the selected results could not load. Fields: {error}, the browser's reason the load failed.
  results_load_error: "Could not load selected results: {error}"
  # Explore, the comparison chart's screen-reader label before it is drawn.
  plot_label: "Error ratio or trial outcomes by instance property"
  # Explore, comparison algorithm picker status, after the suggestion count while suggestions show.
  picker_enter_hint: "Enter chooses the first suggestion"
  # Explore, comparison algorithm picker, the list when no algorithm matches the typed text.
  picker_no_match: "No algorithm matches that text."
  # Explore, comparison algorithm picker, after picker_no_match when the task has transformations. Fields: {transformations}, the task's transformation names, comma-separated.
  picker_transformations: "Transformations on this task: {transformations}."
  # Explore, comparison algorithm picker, the last list row when more algorithms match than it shows. Fields: {count}, how many matches are not shown.
  picker_more: "{count} more, keep typing"
  # Explore, Filter instances, the browser's complaint when an n, d or n/d box holds no whole number.
  range_invalid_whole: "Enter a whole number."
  # Explore, Filter instances, the browser's complaint when a condition-number box holds no positive number.
  range_invalid_positive: "Enter a positive number, or ∞."
  # Explore, Filter instances, hover text on a range box, before range_hint_whole or range_hint_positive. Fields: {value}, the endpoint the box holds.
  range_endpoint: "Inclusive endpoint: {value}."
  # Explore, the comparison chart's status line while its results load.
  comparison_loading: "Loading selected comparison…"
  # Explore, the comparison chart's status line when the chart could not be drawn. Fields: {error}, the reason drawing failed.
  comparison_draw_error: "Could not draw comparison: {error}"
  # Explore, Trial outcomes by instance property, the chart's screen-reader label when a threshold splits the outcomes. Fields: {categories}, how many outcome categories are stacked; {feature}, the instance property; {tau}, the threshold; {bins}, how many bins.
  histogram_label: "Stacked histogram: {categories} outcome categories over {feature}, split at τ = {tau}, {bins} bins, proportion of problem instances on the y-axis."
