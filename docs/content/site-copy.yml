  bin_share: "This bin holds {share} of the weighted problem instances."
  # Explore, This bar panel, under the breakdown table, when the chosen bin holds no instances.
  bin_empty: "This bin holds no problem instances."
  # Explore, This bar panel, the heading over the bin's instance list. Fields: {count}, how many instances the bin holds.
  bin_instances_heading: "Instances in this bin ({count})"
  # Explore, This bar panel, the button under a shortened instance list. Fields: {count}, how many instances the bin holds.
  bin_show_all: "Show all {count}"
  # Explore, Error ratio by instance property, the heading of the panel beside the chart.
  point_details_heading: "This point"
  # Explore, This point panel, the first line once a marker is chosen. Fields: {property}, the instance property's name; {x}, its value; {y}, the error ratio.
  point_reading: "{property}: {x} · error ratio: {y}"
  # Explore, This point panel and a marker's hover text, the count of trials at the point when more than one. Fields: {count}, the number of trials.
  trial_count: "{count} trials"
  # Explore, This point panel and a marker's hover text, the count of trials at the point when there is one. Fields: {count}, which is 1.
  trial_count_one: "{count} trial"
  # Explore, a marker's hover text under median aggregation, the count of median points when more than one. Fields: {count}, the number of median points.
