  # Explore, a marker's hover text under median aggregation, the count of median points when there is one. Fields: {count}, which is 1.
  median_point_count_one: "{count} median point"
  # Explore, This point panel, after an algorithm's name under median aggregation.
  point_median: "median over trials"
  # Explore, This point panel, after an algorithm's count when its trials span several instances. Fields: {count}, the number of instances.
  point_on_instances: "on {count} instances"
  # Explore, This point panel, under the instance cards when the point has more instances than it shows. Fields: {count}, how many instances are not shown.
  point_more_instances: "+{count} more instances"
  # Explore, the notebook download status when the current view has no notebook.
  notebook_no_view: "This view has no notebook."
  # Explore, the notebook download status when the selection is empty.
  notebook_nothing_selected: "Nothing selected."
  # Explore, the notebook download status when the notebook could not be built. Fields: {error}, the reason it failed.
  notebook_build_error: "Could not build the notebook: {error}"
  # Explore, every algorithm search box (Add algorithm, Algorithm, Compare with, Baseline Algorithm…), the greyed text in the box.
  picker_placeholder: "Search…"
  # Explore, an algorithm search's screen-reader status, first: how many are chosen of the most allowed. Fields: {selected}, how many are chosen; {limit}, the most allowed.
  picker_count: "{selected} of {limit} selected"
  # Explore, an algorithm search's screen-reader status, how many suggestions show when several do. Fields: {count}, how many.
  picker_suggestions: "{count} suggestions"
  # Explore, the same when one suggestion shows. Fields: {count}, which is 1.
  picker_suggestions_one: "{count} suggestion"
  # Explore, an algorithm search, the link after picker_no_match to the task's Transformations page.
  picker_browse_transformations: "Browse the Transformations page"
  # Explore, Error ratio by instance property, the button above the plotted list that opens the algorithm search; also that search's screen-reader name.
  add_algorithm: "Add algorithm"
  # Explore, Error ratio by instance property, beside the Algorithms heading: how many algorithms are plotted. Fields: {selected}, how many are chosen; {cap}, the most that can be.
  selected_count: "{selected} of {cap}"
  # Explore, Trial outcomes by instance property, the label over the algorithm whose outcomes are stacked.
