  # Explore, Trial outcomes by instance property, screen-reader name of that button. Fields: {label}, outcome_compare_label as written.
  outcome_clear_aria: "Clear {label}"
  # Explore, Trial outcomes by instance property, on the algorithm and compared-algorithm buttons when none is chosen.
