// Synthetic transport only; calculations, controls, DOM and Plotly are real.
const page = document.querySelector('main');
for (const metric of ['first', 'second']) {
  const section = document.createElement('section');
  section.className = 'dp-metric';
  section.dataset.metric = metric;
  section.dataset.baselineLabel = metric === 'first' ? 'None' : 'reference SE';
  section.hidden = metric !== 'first';
  section.innerHTML = `<div class="dp-filters"><fieldset class="dp-segmented" data-budget-select>
    <legend class="dp-chip-label">Privacy budget</legend>
    <span class="dp-segmented-option"><input type="radio" name="budget-${metric}" id="budget-${metric}-low" value="low" checked><label for="budget-${metric}-low">low</label></span>
    <span class="dp-segmented-option"><input type="radio" name="budget-${metric}" id="budget-${metric}-high" value="high"><label for="budget-${metric}-high">high</label></span>
    </fieldset></div>
    <section class="dp-results-profile" data-reader-terms='{"trial":{"text":"A trial is one execution."}}'>
      <h3 class="dp-profile-heading"></h3><p class="dp-profile-formula"></p>
      <div class="dp-chart" id="chart-${metric}" data-budget="low"></div></section>
    <aside class="dp-plotted" data-plotted-strip hidden><div class="dp-plotted-head">
      <h4 class="dp-plotted-heading" id="chart-${metric}-plotted">Plotted</h4></div>
      <details class="dp-plotted-box" open><summary></summary>
      <ul class="dp-plotted-rows" aria-labelledby="chart-${metric}-plotted"></ul>
      <button type="button" class="dp-plotted-more" hidden></button></details></aside>
    <script type="application/json" data-results-section>{"chart":"chart-${metric}"}<\/script>`;
  for (const budget of ['low', 'high']) {
    section.insertAdjacentHTML('beforeend', `<div class="dp-budget" data-budget="${budget}" ${budget === 'high' ? 'hidden' : ''}>
      <table class="dp-leaderboard" data-columns="rank,algorithm,headline"><thead><tr><th>Rank</th><th>Algorithm</th><th>τ at 90%</th></tr></thead><tbody></tbody></table></div>`);
  }
  page.append(section);
}
const matrices = {
  'first-low': [0.5, 2, 2, 4, 0, 0],
  'first-high': [2, 4, 0.5, 1, 0, 0],
  'second-low': [1, 1, 4, 4, 0, 0],
  'second-high': [1, 1, 4, 4, 0, 0], // Equal answers are legitimate.
};
const index = {
  algorithms: [
    // Alpha and Beta are two configurations of one core: same colour, different marker.
    {uuid: 'a', label: 'Alpha', family: 'A', slot: 1, diagnostic: false, class: 'standard', core: 'AdaSSP', marker: 'circle', transformations: []},
    {uuid: 'b', label: 'Beta', family: 'A', slot: 1, diagnostic: false, class: 'standard', core: 'AdaSSP', marker: 'square', transformations: []},
    {uuid: 'c', label: 'Diagnostic', family: 'C', slot: 3, diagnostic: true, class: 'diagnostic', core: 'SSP', marker: 'circle', transformations: []},
  ],
  instances: [{}, {}], taus: [1, 2, 4], headline_quantile: 0.9, leading: 2,
  headline_metric: 'first', visible_classes: ['standard'], weights: [0.5, 0.5],
  baselines: {

    second: {default: 'published_se', options: [{key: 'published_se', label: 'published_se (protocol)'}]},
  },
  metric_labels: {first: 'first', second: 'second / reference SE'}, panels: [], coverage: {},
};
// Enough algorithms to test top-10 selection rather than roster order. Each takes
// its own core; the strongest opening curve is last in the roster.
const fillerCores = ['BoostedAdaSSP', 'TukeyEM', 'AdaOPS', 'OPSPTR', 'DPSGD',
  'OnePassDPGD', 'IterativeHessianMixing', 'DPGD',
  'TailRobustDPGD', 'TailRobustSparseHuberIHT'];
for (let i = 0; i < 10; i++) {
  index.algorithms.push({uuid: 'f' + i, label: i === 9 ? 'Zulu' : 'Filler ' + i,
    family: 'Other', slot: 0, diagnostic: false, class: 'standard',
    core: fillerCores[i], marker: 'circle', transformations: []});
  for (const matrix of Object.values(matrices)) {
    const cost = i === 9 ? 0.1 : i === 8 ? 3 : i === 7 ? 4 : 9;
    matrix.push(cost, cost);
  }
}
// Three algorithms that always rank last, so the plotted set overruns the
// strip's cap of twelve without changing which ten open drawn.
for (let i = 0; i < 3; i++) {
  index.algorithms.push({uuid: 'z' + i, label: 'Zeta ' + i, family: 'Other', slot: 0,
    diagnostic: false, class: 'standard', core: 'SSP', marker: 'circle', transformations: []});
  for (const matrix of Object.values(matrices)) matrix.push(20, 20);
}
// The readings the build ships, by hand: every algorithm has one trial on each
// of two equally weighted instances, so its error ratio at 0.9 is the larger of
// its two ratios, where it reaches its whole share of 1. The second metric
// reads against a published SE of 2 on both instances; the first, raw cost.
index.headline = {all: {}};
for (const metric of ['first', 'second']) for (const budget of ['low', 'high']) {
  const costs = matrices[`${metric}-${budget}`];
  const against = metric === 'second' ? 2 : 1;
  index.headline.all[`${metric}/${budget}`] = Object.fromEntries(index.algorithms.map((entry, row) => {
    const worst = Math.max(costs[2 * row], costs[2 * row + 1]) / against;
    return [entry.uuid, [worst, 1, worst]];
  }));
}
for (const metric of ['first', 'second']) for (const budget of ['low', 'high']) {
  index.panels.push({metric, budget, runs: `${metric}-${budget}`, seeds: 1, seed_ids: [0], baselines: {published_se: [2, 2]}});
  index.coverage[`${metric}/${budget}`] = {a: [2, 2], b: [2, 2], c: [2, 2]};
  for (let i = 0; i < 10; i++) index.coverage[`${metric}/${budget}`]['f' + i] = [2, 2];
}
const realFetch = window.fetch;
const reads = [];
const provenanceReads = [];
window.fetch = async function (url, options) {
  const name = String(url).split('/').pop();
  if (name.endsWith('-provenance.json')) {
    provenanceReads.push(name);
    const other = name === 'other-provenance.json';
    return Response.json({[other ? 'd' : 'a']: {
      configuration: {},
      declaration: other ? null : {description: 'Estimate alpha privately.'},
      component: {
        kind: 'Algorithm', name: other ? 'Other task implementation' : 'Alpha implementation',
        summary: other ? '' : 'Estimate `alpha` privately.',
        docs: 'library/', hyperparameters: [], children: [],
      },
    }});
  }
  if (name === 'index.json') return Response.json(index);
  if (!matrices[name]) return realFetch(url, options);
  reads.push(name);
  const bytes = new Blob([new Float64Array(matrices[name]).buffer]).stream();
  return new Response(bytes.pipeThrough(new CompressionStream('gzip')));
};

<script>
window.addEventListener('load', async () => {
  const report = document.querySelector('#results');

    const pass = JSON.stringify(actual) === JSON.stringify(expected);
    outcomes.push(`${pass ? 'PASS' : 'FAIL'} ${name}: ${JSON.stringify(actual)}${pass ? '' : ' expected ' + JSON.stringify(expected)}`);
  }

  const rows = () => active().querySelectorAll('.dp-budget:not([hidden]) tbody tr');

  const plotted = () => active().querySelector('.dp-chart').data.filter(trace => trace.visible !== false && trace.visible !== 'legendonly');
  const paths = () => Array.from(active().querySelectorAll('.js-line'), line => line.getAttribute('d'));
  /* Column integrity, asserted after every action over every panel on the
     page rather than over the one panel a static read can see: a table
     declares the columns its client-side re-render builds each row from, so
     the declaration, the header and every row have to stay the same width. */
  let auditing = true;
  let audits = 0;
  let settles = 0;
  let panels = 0;
  const mismatches = [];
  function auditColumns(label) {
    if (!auditing) return;
    settles += 1;
    let seen = 0;
    for (const table of page.querySelectorAll('.dp-leaderboard')) {
      if (!table.tHead) continue;
      audits += 1;
      seen += 1;
      const declared = (table.getAttribute('data-columns') || '').split(',').filter(Boolean).length;
      const heads = table.tHead.rows[0].cells.length;
      const widths = Array.from(new Set(Array.from(table.tBodies[0].rows, row => row.cells.length)));
      if (!declared || declared !== heads || widths.some(width => width !== heads)) {
        mismatches.push({label, declared, heads, widths});
      }
    }
    panels = panels || seen;
    if (seen !== panels) mismatches.push({label, panelsSeen: seen, expected: panels});
  }
  async function settle(label) {
    // Allow event handlers and Plotly's asynchronous rendering to finish.
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const limit = Date.now() + 5000;
    while (active().dataset.loading !== 'false' || !active().querySelector('.js-line')) {
      if (Date.now() > limit) throw new Error('Panel did not finish loading');
      await new Promise(resolve => setTimeout(resolve, 20));
    }
    await new Promise(resolve => setTimeout(resolve, 50));
    auditColumns(label || 'action');
  }
  async function select(label, value) {

        const legend = el.tagName === 'FIELDSET' ? el.querySelector('legend') : el.previousElementSibling;
        return legend && legend.textContent.trim() === label;

    await settle();
  }
  const slider = page.querySelector('[type="range"]');
  const top = page.querySelector('[data-top-n]');
  // The "other task" aside is a bare stand-in for a second results section
  // on the same physical page (Home carries several); it never runs the full

    check('chart dependencies loaded before startup', [

      typeof window.dpPanel?.loadIndex,

    check('an unwritten slot is its marker alone as tokens',

    const unknownBadge = window.dpInterpretationBadge(undefined);

    const classHost = document.createElement('div');

    coreButton('Deselect all').click();
    // Nothing is drawn now, so wait out the handlers rather than a curve.
    await new Promise(resolve => setTimeout(resolve, 100));
    Array.from(coresPanel.querySelectorAll('.dp-checklist-row'))
      .find(row => row.textContent.includes('AdaSSP')).querySelector('input').click();
    await settle();
    check('a filter leaves only the rows it keeps in the ranked legend',
      legendRanks().map(([uuid]) => uuid), ['a', 'b']);
    check('and each kept row keeps its rank in the full pool',
      legendRanks(), fullRanks.filter(([uuid]) => uuid === 'a' || uuid === 'b'));
    coreButton('Select all').click();
    await settle();
    check('clearing the filter brings the whole ranked legend back',
      legendRanks(), fullRanks);
    top.value = 'all';
    top.dispatchEvent(new Event('change'));
    await settle();
    check('every eligible curve is drawn', plotted().length, 15);
    check('all curves shown draws both emphasised and muted curves',
      [drawnLevels().includes(0), drawnLevels().includes(1)], [true, true]);
    check('emphasised curves draw above the muted ones at the threshold now read',
      drawnLevels().every((level, at, all) => at === 0 || all[at - 1] <= level), true);
    top.value = '10';
    top.dispatchEvent(new Event('change'));
    await settle();
    // Every check through "round trip restores values" is stated at the
    // opening quantile, so restore it explicitly rather than leaving budget and
    // metric selection entangled with a quantile this block never varies.
    slider.value = '90';
    slider.dispatchEvent(new Event('input', {bubbles: true}));
    await settle();
    await select('Privacy budget', 'high');
    check('budget selects its own values', values(), [['b', '1'], ['a', '4']]);
    check('known distinct budget changes rendered curves', JSON.stringify(paths()) !== JSON.stringify(opening), true);
    await select('Metric', 'second');
    check('metric change preserves selected budget', active().querySelector('.dp-chart').dataset.budget, 'high');
    check('budget control agrees after metric change', page.querySelector('.dp-privacy-filters:not([hidden]) [data-budget-select]').value, 'high');
    check('metric switch updates baseline label', page.querySelector('[data-official-baseline-label]').textContent, 'reference SE');
    check('metric selects its own values', values(), [['a', '0.5'], ['b', '2']]);
    check('equal-valued panel still loads separately', reads.includes('second-high'), true);
    check('equal-valued panel is not a false failure', values(), [['a', '0.5'], ['b', '2']]);
    await select('Privacy budget', 'low');
    check('budget change preserves selected metric', active().dataset.metric, 'second');
    check('other budget is loaded explicitly', reads.includes('second-low'), true);
    await select('Metric', 'first');
    check('metric return keeps the latest budget choice', active().querySelector('.dp-chart').dataset.budget, 'low');
    check('round trip restores values', values(), [['a', '2'], ['b', '4']]);
    check('round trip restores rendered curves', paths(), opening);
    // At p = 50% the reading is the grid's: the first threshold (1, 2, 4)
    // at which a curve reaches half its trials, by hand from the matrices.
    slider.value = '50';
    slider.dispatchEvent(new Event('input', {bubbles: true}));
    await settle();
    check('the quantile changes standings', values(), [['a', '1'], ['b', '2']]);
    check('the standings score heading names the quantile',
      active().querySelector('.dp-score-heading').textContent, 'τ at 50%');
    top.value = '5';
    top.dispatchEvent(new Event('change', {bubbles: true}));
    await settle();
    // At p = 50%, by hand: Zulu (f9) and Alpha both first reach half at τ = 1
    // and their whole share, so the τ at which they reach it breaks the tie
    // (0.1 before 2); Beta reaches half at 2; f8 and f7 at 4, tied until their
    // whole shares (3 before 4).
    const order = () => Array.from(rows(), row => row.dataset.uuid).slice(0, 5);
    check('top 5 is selectable', plotted().map(trace => trace.legendgroup).sort(), ['a', 'b', 'f7', 'f8', 'f9'].sort());
    check('the standings at 50% follow the one ranking rule', order(), ['f9', 'a', 'b', 'f8', 'f7']);
    slider.value = '90';
    slider.dispatchEvent(new Event('input', {bubbles: true}));
    await settle();
    // At 90%, the shipped readings: Beta's 4 now ranks after f8's 3.
    check('a quantile move reorders the standings', order(), ['f9', 'a', 'f8', 'b', 'f7']);
    top.value = 'all';
    top.dispatchEvent(new Event('change', {bubbles: true}));
    await settle();
    check('all plots the full eligible pool', plotted().length, 15);
    top.value = '10';
    top.dispatchEvent(new Event('change', {bubbles: true}));
    slider.value = '90';
    slider.dispatchEvent(new Event('input', {bubbles: true}));
    await settle();
    const alpha = active().querySelector('.dp-budget:not([hidden]) tr[data-uuid="a"]');
    alpha.focus();
    // A programmatic .focus() does not reliably dispatch a trusted 'focusin'
    // in every host (some headless/background CDP sessions move
    // document.activeElement without firing it); the row-focus delegation
    // this exercises listens for 'focusin' specifically (profile-charts.js),
    // so fire it explicitly the way every other native-event check in this
    // file already does for 'change'/'input'.
    alpha.dispatchEvent(new FocusEvent('focusin', {bubbles: true}));
    await settle();
    check('row focus highlights row', alpha.classList.contains('dp-row-highlight'), true);
    // The raised width is regularWidth (2.5, from this fixture's own
    // data-series-style) + 1.5 = 4 exactly (profile-charts.js's raised());
    // a strict "> 4" never matches that computed value.
    check('row focus emphasizes a curve', Array.from(active().querySelectorAll('.js-line')).some(line => parseFloat(getComputedStyle(line).strokeWidth) >= 4), true);
    alpha.blur();
    alpha.dispatchEvent(new FocusEvent('focusout', {bubbles: true}));
    // Exercise the Plotly event boundary; independent browser QA checks actual pointer use.
    active().querySelector('.dp-chart').emit('plotly_hover', {points: [{data: {legendgroup: 'b'}}]});
    check('chart hover highlights matching table row', active().querySelector('.dp-budget:not([hidden]) tr[data-uuid="b"]').classList.contains('dp-row-highlight'), true);
    active().querySelector('.dp-chart').emit('plotly_unhover');
    check('four panels fetched exactly once', reads.slice().sort(), Object.keys(matrices).sort());
    async function details(button) {
      button.click();
      const dialog = document.querySelector('.dp-algorithm-dialog:not(.dp-filter-dialog)');
      const limit = Date.now() + 1000;
      while (!dialog.querySelector('.dp-pipeline')) {
        if (Date.now() > limit) throw new Error('Details did not open');
        await new Promise(resolve => setTimeout(resolve, 10));
      }
      const title = dialog.querySelector('.dp-algorithm-dialog-title')?.textContent;
      const description = dialog.querySelector('.dp-algorithm-dialog-body > p')?.textContent ?? null;
      const chain = dialog.querySelector('.dp-pipeline .dp-step-name')?.textContent;
      const fullDetails = dialog.querySelector('.dp-algorithm-dialog-body > a')?.textContent;
      if (title === 'Alpha') check('selected method details retain the roster interpretation',
        dialog.querySelector('[data-privacy-interpretation]')?.textContent, 'standard');
      dialog.querySelector('.dp-provenance-close').click();
      return [title, description, chain, fullDetails];
    }
    const alphaDetails = active().querySelector('.dp-budget:not([hidden]) tr[data-uuid="a"] .dp-provenance-trigger');
    const alphaCard = ['Alpha', 'Estimate alpha privately.', 'Alpha implementation', '\u27e8component.full_details\u27e9'];
    check('first task Details', await details(alphaDetails), alphaCard);
    check('other task Details, no description', await details(document.querySelector('aside .dp-provenance-trigger')), ['Other task', null, 'Other task implementation', '\u27e8component.full_details\u27e9']);
    check('first task Details after return', await details(alphaDetails), alphaCard);
    check('one provenance fetch per task', provenanceReads, ['first-provenance.json', 'other-provenance.json']);

    check('every panel kept its declared column count through every re-render', mismatches, []);
    check('column integrity was asserted on every panel after every action', audits, settles * panels);

    /* One source of columns. A row is built from the set its table declares,
       so a surface that renders three columns still has three after the
       quantile moves or the pager changes the rows. */
    function shapes() {
      return Array.from(active().querySelectorAll('.dp-budget:not([hidden]) .dp-leaderboard')).map(table => {
        const heads = table.tHead.rows[0].cells.length;
        const rows = Array.from(table.tBodies[0].rows);
        return {
          heads,
          rows: rows.length,
          widths: Array.from(new Set(rows.map(row => row.cells.length))),
          beyondHeader: rows.some(row => row.cells.length > heads),
        };
      });
    }
    async function move(quantile, top_n) {
      slider.value = quantile;
      slider.dispatchEvent(new Event('input', {bubbles: true}));
      top.value = top_n;
      top.dispatchEvent(new Event('change', {bubbles: true}));
      await settle();
    }
    await move('50', '10');
    let shape = shapes()[0];
    check('leaderboard rows are as wide as its header', [shape.widths, shape.beyondHeader], [[3], false]);
    check('leaderboard header is the three ruled columns', shape.heads, 3);
    await move('90', '5');
    check('paging keeps the three columns', shapes()[0].widths, [3]);
  } catch (error) {
    outcomes.push('FAIL execution: ' + error.message);
  }
  report.textContent = outcomes.join('\n');
  document.title = (outcomes.some(line => line.startsWith('FAIL')) ? 'FAIL' : 'PASS') + ' — Leaderboard interaction regression';
});
</script>
</body>
</html>
